<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestros Capítulos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="wrap">

    <!-- Cabecera -->
    <header class="hero">
      <span class="badge">💜 Un rincón solo para nosotros</span>
      <h1>Nuestros Capítulos</h1>
      <p class="subtitle">Cada tres días se abre una nueva carta de mi corazón para ti, mi vida.</p>

      <button id="musicBtn" class="music-btn" type="button" aria-pressed="false">
        <span class="music-icon">🎵</span>
        <span id="musicLabel">Reproducir música instrumental</span>
      </button>

      <div class="progress">
        <div class="progress-info">
          <span>Capítulos desbloqueados: <strong id="unlockedCount">0</strong> de <span id="totalCount">22</span></span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>
    </header>

    <!-- Tarjetas -->
    <section id="grid" class="grid" aria-label="Lista de capítulos"></section>

    <footer class="footer">Hecho con todo mi amor 💜</footer>
  </main>

  <!-- Lector de capítulo -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" data-close aria-label="Cerrar">✕</button>
      <span id="modalNumber" class="modal-number"></span>
      <h2 id="modalTitle"></h2>
      <div id="modalText" class="modal-text"></div>
    </article>
  </div>

  <!-- Pon aquí tu canción instrumental (mismo nombre de archivo) -->
  <audio id="bgMusic" src="musica.mp3" loop preload="none"></audio>

  <script src="capitulos.js"></script>
  <script src="script.js"></script>
</body>
</html>
